<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💻</text></svg>" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mohit Chaudhary | macOS Portfolio</title>
  <meta name="description"
    content="Interactive macOS themed React.js portfolio featuring desktop environment, interactive windows, terminal CLI, project showcase, and animations." />
</head>

<body>
  <!-- Liquid Glass refraction filter, shared by .liquid-glass-refract (see index.css) -->
  <svg style="position: absolute; width: 0; height: 0; overflow: hidden" aria-hidden="true" focusable="false">
    <defs>
      <filter id="liquid-glass-distortion" x="-20%" y="-20%" width="140%" height="140%"
        color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.008 0.012" numOctaves="2" seed="7" result="noise" />
        <feGaussianBlur in="noise" stdDeviation="2" result="blurredNoise" />
        <feDisplacementMap in="SourceGraphic" in2="blurredNoise" scale="18" xChannelSelector="R"
          yChannelSelector="G" />
      </filter>
    </defs>
  </svg>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
